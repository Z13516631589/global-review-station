name: update

on:
  push:
    branches: [main]
  schedule:
    # 说明：GitHub 在整点/半点负载最高，排队任务可能被丢弃，
    # 所以刻意避开 :00 和 :30，统一用 :13 / :43 / :33 / :23 这类冷门分钟。
    # ---- 周一~周五：A股交易日 ----
    # 盘前消息：北京 09:13
    - cron: '13 1 * * 1-5'
    # 盘中刷新：北京 09:43 ~ 15:13，每 30 分钟一次
    - cron: '43 1-6 * * 1-5'
    - cron: '13 2-7 * * 1-5'
    # A股收盘：北京 15:33
    - cron: '33 7 * * 1-5'
    # A股盘后（龙虎榜 / 融资余额）：北京 18:33
    - cron: '33 10 * * 1-5'
    # 美股收盘：北京 04:23（周二~周六凌晨）
    - cron: '23 20 * * 2-6'
    # ---- 周末：轻量刷新全球快照与消息面 ----
    - cron: '13 5 * * 0,6'
  workflow_dispatch:
    inputs:
      batch:
        description: '更新批次'
        required: false
        default: '盘中刷新'
        type: choice
        options:
          - 盘中刷新
          - 盘前消息
          - A股收盘
          - A股盘后
          - 美股收盘

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析更新批次与站点地址
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          {
            echo "BASE_PATH=/${REPO_NAME}/"
            echo "SITE_URL=https://${{ github.repository_owner }}.github.io/${REPO_NAME}"
          } >> "$GITHUB_ENV"
          if [ -n "${{ github.event.inputs.batch }}" ]; then
            BATCH="${{ github.event.inputs.batch }}"
          else
            case "${{ github.event.schedule }}" in
              "13 1 * * 1-5")    BATCH="盘前消息" ;;
              "33 7 * * 1-5")    BATCH="A股收盘" ;;
              "33 10 * * 1-5")   BATCH="A股盘后" ;;
              "23 20 * * 2-6")   BATCH="美股收盘" ;;
              "13 5 * * 0,6")    BATCH="周末刷新" ;;
              *)                 BATCH="盘中刷新" ;;
            esac
          fi
          echo "FETCH_BATCH=$BATCH" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装数据依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 抓取数据
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          NEWS_RSS: ${{ vars.NEWS_RSS }}
        run: |
          echo "批次：$FETCH_BATCH"
          python scripts/fetch_all.py --batch "$FETCH_BATCH" || true

      - name: 打印数据时间戳（便于排查"内容没变"）
        run: |
          python - <<'PY'
          import json, pathlib
          for p in sorted(pathlib.Path('src/data').glob('*.json')):
              try:
                  d = json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  print(p.name, 'parse failed', e)
                  continue
              print(f"{p.name}: updatedAt={d.get('updatedAt')} batch={d.get('batch')} stale={d.get('stale')}")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装前端依赖
        run: npm ci

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 构建静态站
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
