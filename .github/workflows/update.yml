name: update

on:
  push:
    branches: [main]
  schedule:
    # 说明：GitHub 在整点/半点负载最高，排队任务可能被丢弃，
    # 所以刻意避开 :00 和 :30，统一用 :13 / :43 / :33 / :23 这类冷门分钟。
    # ---- 周一~周五：A股交易日 ----
    # 盘前消息：北京 09:13
    - cron: '13 1 * * 1-5'
    # 盘中刷新：北京 09:43 ~ 15:13，每 30 分钟一次
    - cron: '43 1-6 * * 1-5'
    - cron: '13 2-7 * * 1-5'
    # A股收盘：北京 15:33
    - cron: '33 7 * * 1-5'
    # A股盘后（龙虎榜 / 融资余额）：北京 18:33
    - cron: '33 10 * * 1-5'
    # 美股收盘：北京 05:23（周二~周六凌晨）
    # 说明：04:23 太赶——美股 04:00 才收盘，新浪日 K 往往要延迟更久才更新出当日数据，
    # 抓太早会拿到上一个交易日的 K 线（表现为"数据对不上"）。这里推迟一小时，
    # 并配合 fetch_global.py 的日期闸门：源没更新就自动换源。
    - cron: '23 21 * * 2-6'
    # ---- 周末：轻量刷新全球快照与消息面 ----
    - cron: '13 5 * * 0,6'
  workflow_dispatch:
    inputs:
      batch:
        description: '更新批次'
        required: false
        default: '盘中刷新'
        type: choice
        options:
          - 盘中刷新
          - 盘前消息
          - A股收盘
          - A股盘后
          - 美股收盘

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析更新批次与站点地址
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          {
            echo "BASE_PATH=/${REPO_NAME}/"
            echo "SITE_URL=https://${{ github.repository_owner }}.github.io/${REPO_NAME}"
          } >> "$GITHUB_ENV"
          if [ -n "${{ github.event.inputs.batch }}" ]; then
            BATCH="${{ github.event.inputs.batch }}"
          else
            case "${{ github.event.schedule }}" in
              "13 1 * * 1-5")    BATCH="盘前消息" ;;
              "33 7 * * 1-5")    BATCH="A股收盘" ;;
              "33 10 * * 1-5")   BATCH="A股盘后" ;;
              "23 21 * * 2-6")   BATCH="美股收盘" ;;
              "13 5 * * 0,6")    BATCH="周末刷新" ;;
              *)                 BATCH="盘中刷新" ;;
            esac
          fi
          echo "FETCH_BATCH=$BATCH" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装数据依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 抓取数据
        # 硬超时 16 分钟：宁可带着上一版数据继续发布，也不能让流水线无限挂着。
        # 每个子脚本还有各自的软限时（新闻 120s / A股 300s / 全球 420s），
        # 保证慢的那只不会把其它几只的时间全吃掉。
        timeout-minutes: 16
        continue-on-error: true
        env:
          HTTP_TIMEOUT: '25'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          NEWS_RSS: ${{ vars.NEWS_RSS }}
        run: |
          echo "批次：$FETCH_BATCH"
          timeout 900 python scripts/fetch_all.py --batch "$FETCH_BATCH" || echo "抓取超时或失败，沿用上一版数据"

      - name: 打印数据时间戳 + 新鲜度自检（便于排查"内容没变"）
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          now = datetime.datetime.now(datetime.timezone.utc)
          for p in sorted(pathlib.Path('src/data').glob('*.json')):
              try:
                  d = json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  print(p.name, 'parse failed', e)
                  continue
              ua = d.get('updatedAt')
              age = ''
              if ua:
                  try:
                      ts = datetime.datetime.fromisoformat(ua)
                      if ts.tzinfo is None:
                          ts = ts.replace(tzinfo=datetime.timezone.utc)
                      hours = (now - ts).total_seconds() / 3600
                      age = f" (约 {hours:.1f} 小时前)"
                      if hours > 6:
                          print(f"  ⚠️ {p.name} 距上次更新已超过 6 小时，抓取可能长期失败")
                  except Exception:
                      pass
              print(f"{p.name}: updatedAt={ua} batch={d.get('batch')} stale={d.get('stale')}{age}")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装前端依赖
        run: npm ci

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 构建静态站
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 抓取结果回写仓库（兜底，避免失败时退回旧数据）
        # 仅在定时 / 手动触发时回写；push 触发的不回写（否则每次改代码都多一次提交）。
        # 提交信息带 [skip ci]，避免回写本身又触发一次 workflow 造成死循环。
        if: github.event_name != 'push'
        env:
          # 用 GitHub 机器人身份提交，并明确标注「自动生成」
          GIT_AUTHOR_NAME: '数据脚本（自动生成）'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: '数据脚本（自动生成）'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        run: |
          git config user.name "数据脚本（自动生成）"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过回写"
          else
            git commit -m "data: 自动更新数据快照 [$FETCH_BATCH] [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "回写失败（不影响本次部署）"
          fi

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
